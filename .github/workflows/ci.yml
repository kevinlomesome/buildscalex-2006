name: Enterprise CI Verification

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    name: TypeCheck, Build & Acceptance Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Check
        run: npx tsc --noEmit

      - name: Run Next.js Production Build
        run: npm run build

      - name: Start Production Server
        run: |
          npm run start &
          npx wait-on http://localhost:3000

      - name: Run Enterprise E2E Acceptance Test Suite
        run: npm test
