# apphosting.yaml
# Firebase App Hosting Configuration for Build Scale X

# Cloud Run compute allocation
runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 100
  concurrency: 80

# Environment variables injected during Next.js container build and runtime
env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyBU_ni49rsCgpqQxbpXOT7mmC7xSNR6N74
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: buildscalex-cd101.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: buildscalex-cd101
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: buildscalex-cd101.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "223278299574"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:223278299574:web:99e746b13fe4402de1e917
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    value: G-1S8ZFK9N0N
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_SITE_URL
    value: https://buildscalex.in
    availability:
      - BUILD
      - RUNTIME
